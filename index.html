<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Fabric Layout Simulator</title>
<style>
  * {
    box-sizing: border-box
  }

  body {
    margin: 0;
    background: #0f1820;
    color: #edf4f6;
    font: 16px system-ui, sans-serif
  }

  main {
    max-width: 1478px;
    margin: auto;
    padding: clamp(18px, 4vw, 48px)
  }

  h1 {
    margin: 0 0 24px;
    font-size: clamp(26px, 4vw, 44px);
    letter-spacing: -.035em
  }

  .layout {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr) 260px;
    gap: 18px;
    align-items: start
  }

  form,
  section {
    background: #17242e;
    border: 1px solid #354651;
    border-radius: 14px;
    padding: 18px
  }

  form {
    display: grid;
    gap: 12px
  }

  label {
    display: block
  }

  input,
  select,
  button {
    font: inherit
  }

  input[type=number],
  input[type=text],
  select {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 7px 9px;
    color: inherit;
    background: #0f1820;
    border: 1px solid #607783;
    border-radius: 6px
  }

  #preset-controls {
    display: grid;
    gap: 8px;
    min-width: 0;
    overflow-wrap: anywhere
  }

  #preset-heading {
    margin: 0 0 4px;
    font-size: 1.1rem
  }

  input[type=checkbox] {
    accent-color: #79e2ce
  }

  button {
    background: #9ff3df;
    color: #102a26;
    border: 0;
    border-radius: 7px;
    padding: 9px;
    font-weight: 700;
    cursor: pointer
  }

  button:disabled {
    opacity: .5;
    cursor: default
  }

  p {
    margin: 0;
    color: #c4d7de;
    font-size: .9rem
  }

  #summary {
    margin-bottom: 12px
  }

  svg {
    display: block;
    width: 100%;
    height: clamp(260px, 60vh, 650px);
    border-radius: 8px
  }

  @media (max-width: 950px) {
    .layout {
      grid-template-columns: 250px minmax(0, 1fr)
    }
  }

  @media (max-width: 700px) {
    .layout {
      grid-template-columns: minmax(0, 1fr)
    }
  }
</style>
<main>
  <h1>LED Fabric Layout Simulator</h1>
  <div class="layout">
    <form id="controls">
      <label>LED spacing (in) <input name="pitch" type="number" min=".001" step="any" value="2" required></label>
      <label>Row width (in) <input name="width" type="number" min=".001" step="any" value="23" required></label>
      <label>Row spacing (in) <input name="gap" type="number" min=".001" step="any" value="3" required></label>
      <label>Number of LEDs <input name="count" type="number" min="1" max="20000" step="1" value="103" required></label>
      <label>First LED offset (in) <input name="offset" type="number" min="0" step="any" value="0" required></label>
      <label>Turns <select name="turn">
          <option value="sharp">Sharp corners</option>
          <option value="round">Rounded U-turns</option>
          <option value="diagonal">Diagonal LED-to-LED</option>
        </select></label>
      <div id="diagonal-lead-control" hidden>
        <label>Diagonal lead-in (in) <input name="diagonalLead" type="number" min="0" step="any" value="0" required disabled></label>
        <label><input name="adjustLead" type="checkbox"> Adjust lead-in to fit</label>
        <label><input name="reverseLead" type="checkbox"> Try lead-in in either direction</label>
        <label><input name="skipRows" type="checkbox"> Skip rows if needed</label>
        <label><input name="reduceGap" type="checkbox"> Reduce row spacing if needed</label>
        <label><input name="extraBend" type="checkbox"> Allow extra bends</label>
        <label><input name="retryRoute" type="checkbox"> Revisit earlier placement choices</label>
      </div>
      <p>Rounded turns extend half the row spacing beyond each straight row end where the wire turns.</p>
      <label><input name="labels" type="checkbox"> LED numbers</label>
      <label><input name="wire" type="checkbox" checked> Wire path</label>
      <label><input name="grid" type="checkbox" checked> Inch grid</label>
      <button id="export" type="button">Download SVG</button>
    </form>
    <section aria-label="Layout preview">
      <p id="summary" role="status"></p>
      <svg id="preview" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Serpentine LED layout"></svg>
    </section>
    <section id="preset-controls" aria-labelledby="preset-heading">
      <h2 id="preset-heading">Presets</h2>
      <label>Saved layout <select id="preset-list"></select></label>
      <label>Preset name <input id="preset-name" type="text" maxlength="80"></label>
      <button id="save-preset" type="button">Save preset</button>
      <button id="export-presets" type="button">Download preset library</button>
      <p id="preset-status" role="status">Save the downloaded presets.js beside index.html to keep your presets.</p>
    </section>
  </div>
</main>
<script src="./presets.js"></script>
<script>
  'use strict';
  const controls = document.querySelector('#controls');
  const preview = document.querySelector('#preview');
  const summary = document.querySelector('#summary');
  const download = document.querySelector('#export');
  const presetList = document.querySelector('#preset-list');
  const presetName = document.querySelector('#preset-name');
  const presetStatus = document.querySelector('#preset-status');
  const presets = new Map((window.ledLayoutPresets ?? []).map(preset => [preset.name, preset.settings]));
  const diagonalLeadControl = document.querySelector('#diagonal-lead-control');
  const continuationFields = ['adjustLead', 'reverseLead', 'skipRows', 'reduceGap', 'extraBend', 'retryRoute'];
  const presetFields = ['pitch', 'width', 'gap', 'count', 'offset', 'turn', 'diagonalLead', ...continuationFields, 'labels', 'wire', 'grid'];
  const svgNS = 'http://www.w3.org/2000/svg';
  const inches = new Intl.NumberFormat('en-US', { maximumFractionDigits: 3 });

  function add(parent, tag, attributes) {
    const node = document.createElementNS(svgNS, tag);
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
    parent.append(node);
    return node;
  }

  function layout(width, gap, length, rounded) {
    const radius = gap / 2;
    const turnLength = rounded ? Math.PI * radius : gap;
    const stride = width + turnLength;
    const lastRow = Math.floor(length / stride);
    if (!Number.isFinite(stride) || lastRow >= 20000) return null;

    function pointAt(distance) {
      const row = Math.floor(distance / stride);
      const along = distance - row * stride;
      const right = row % 2 === 0;
      const y = row * gap;
      if (along <= width) return [right ? along : width - along, y];
      const end = right ? width : 0;
      const alongTurn = along - width;
      if (!rounded) return [end, y + alongTurn];
      const angle = alongTurn / radius;
      return [end + (right ? 1 : -1) * radius * Math.sin(angle), y + radius * (1 - Math.cos(angle))];
    }

    let path = 'M 0 0';
    let left = 0;
    let right = Math.min(length, width);
    const [lastX, bottom] = pointAt(length);
    for (let row = 0; row <= lastRow; row++) {
      const goesRight = row % 2 === 0;
      const end = goesRight ? width : 0;
      const remaining = length - row * stride;
      if (remaining <= width) {
        path += ' H ' + lastX;
        break;
      }
      path += ' H ' + end;
      const [turnX, turnY] = row === lastRow ? [lastX, bottom] : [end, (row + 1) * gap];
      if (rounded) {
        path += ` A ${radius} ${radius} 0 0 ${goesRight ? 1 : 0} ${turnX} ${turnY}`;
        const reach = radius * Math.sin(Math.min(Math.PI / 2, (remaining - width) / radius));
        if (goesRight) right = Math.max(right, width + reach);
        else left = Math.min(left, -reach);
      } else {
        path += ' V ' + turnY;
      }
    }
    return { path, pointAt, left, right, bottom };
  }

  function diagonalLayout(width, gap, pitch, offset, count, lead, options = {}) {
    const tolerance = Math.min(pitch, width) * Number.EPSILON * 8;
    const fits = x => x >= -tolerance && x <= width + tolerance;
    const clampX = x => Math.max(0, Math.min(width, x));

    function* landings(x, sign, drop, adjustable) {
      const maxLead = Math.min(sign > 0 ? width - x : x, pitch - drop);
      if (maxLead < 0) return;
      let lengths = [lead];
      if (adjustable) {
        const closest = Math.min(lead, maxLead);
        lengths = [closest, 0, maxLead];
        // A landing can enter or leave the fabric only at an edge.
        for (const edge of [0, width]) {
          const horizontal = sign * (edge - x);
          const slack = pitch - horizontal;
          if (slack > 0) lengths.push((pitch + horizontal - drop * (drop / slack)) / 2);
        }
        lengths = [...new Set(lengths)].sort((a, b) => Math.abs(a - lead) - Math.abs(b - lead));
      }

      for (const length of lengths) {
        if (length < -tolerance || length > maxLead + tolerance) continue;
        const bend = clampX(x + sign * Math.max(0, Math.min(length, maxLead)));
        const remaining = pitch - Math.abs(bend - x);
        const ratio = Math.min(1, drop / remaining);
        const reach = remaining * Math.sqrt((1 - ratio) * (1 + ratio));
        for (const nextX of new Set([bend - sign * reach, bend + sign * reach])) {
          if (fits(nextX)) yield { x: clampX(nextX), drop, bends: bend === x ? [] : [[bend, 0]] };
        }
      }
    }

    function* turns(x, direction) {
      let fallback = false;
      for (const turn of landings(x, direction, gap, false)) {
        yield { ...turn, fallback };
        fallback = true;
      }
      const signs = options.reverseLead ? [direction, -direction] : [direction];
      if (options.reverseLead) yield* landings(x, -direction, gap, false);
      if (options.adjustLead) {
        const adjusted = signs.map(sign => landings(x, sign, gap, true).next().value).filter(Boolean);
        adjusted.sort((a, b) => Math.abs(Math.abs((a.bends[0]?.[0] ?? x) - x) - lead)
          - Math.abs(Math.abs((b.bends[0]?.[0] ?? x) - x) - lead));
        yield* adjusted;
        if (options.retryRoute) {
          for (const sign of signs) yield* landings(x, sign, gap, true);
        }
      }
      if (options.reduceGap) {
        for (const sign of signs) {
          const room = sign > 0 ? width - x : x;
          const length = options.adjustLead ? Math.min(lead, room, pitch - Math.min(pitch, gap) / 2) : lead;
          const drop = pitch - length;
          if (length <= room && drop > 0 && drop < gap) {
            const nextX = clampX(x + sign * length);
            yield { x: nextX, drop, bends: length ? [[nextX, 0]] : [] };
          }
        }
      }
      if (options.skipRows) {
        // With more vertical drop, a landing moves closer to its in-bounds bend.
        let low = 2;
        const available = options.adjustLead ? pitch : pitch - lead;
        let high = Math.min(Math.floor(available / gap), Number.MAX_SAFE_INTEGER);
        if (high >= low) {
          const atRow = row => signs.flatMap(sign => [...landings(x, sign, row * gap, options.adjustLead)]);
          if (atRow(high).length) {
            while (low < high) {
              const middle = low + Math.floor((high - low) / 2);
              if (atRow(middle).length) high = middle;
              else low = middle + 1;
            }
            yield* atRow(low);
          }
        }
      }
      if (options.extraBend) {
        for (const sign of signs) {
          const room = sign > 0 ? width - x : x;
          const maxLead = Math.min(room, pitch - gap);
          if (maxLead < 0 || (!options.adjustLead && lead > maxLead)) continue;
          const length = Math.min(lead, maxLead);
          let bendX = clampX(x + sign * length);
          let horizontal = pitch - gap - length;
          const legs = Math.ceil(horizontal / width) + 1;
          if (legs > 256) continue;
          const bends = length ? [[bendX, 0]] : [];
          for (let leg = 1; leg <= legs && horizontal > tolerance; leg++) {
            const y = gap * (leg / (legs + 1));
            const side = bendX < width / 2 ? 1 : -1;
            const distance = Math.min(horizontal, side > 0 ? width - bendX : bendX);
            bends.push([bendX, y]);
            bendX = clampX(bendX + side * distance);
            bends.push([bendX, y]);
            horizontal -= distance;
          }
          yield { x: bendX, drop: gap, bends };
        }
      }
    }

    function* nextSteps({ x, direction, drop }) {
      const straight = x + direction * pitch;
      if (fits(straight)) yield { x: clampX(straight), drop: 0, direction, bends: [] };
      if (!fits(straight) || options.retryRoute) {
        for (const turn of turns(x, direction)) {
          const roomDifference = width - 2 * turn.x;
          yield {
            ...turn,
            fallback: fits(straight) || turn.fallback !== false,
            direction: Math.abs(roomDifference) <= tolerance ? -direction : Math.sign(roomDifference)
          };
        }
      }
      const reverse = x - direction * pitch;
      if (options.retryRoute && drop > 0 && fits(reverse)) {
        yield { x: clampX(reverse), drop: 0, direction: -direction, bends: [], fallback: true };
      }
    }

    const route = [{ x: offset, y: 0, direction: 1, bends: [] }];
    const choices = [nextSteps(route[0])];
    let longest = route.slice();
    let retries = 0;
    while (route.length < count) {
      const step = choices.at(-1).next().value;
      if (step) {
        step.y = route.at(-1).y + step.drop;
        route.push(step);
        choices.push(nextSteps(step));
      } else {
        if (route.length > longest.length) longest = route.slice();
        if (!options.retryRoute || route.length === 1 || retries++ >= 10000) break;
        route.pop();
        choices.pop();
      }
    }

    const placed = route.length >= longest.length ? route : longest;
    const positions = placed.map(({ x, y }) => [x, y]);
    const path = [`M 0 0 H ${offset}`];
    const fallbackPath = [];
    let right = offset;
    for (let index = 1; index < placed.length; index++) {
      const { x, y, bends, fallback } = placed[index];
      const previous = placed[index - 1];
      const segment = [];
      for (const [bendX, drop] of bends) {
        segment.push(`L ${bendX} ${previous.y + drop}`);
        right = Math.max(right, bendX);
      }
      segment.push(`L ${x} ${y}`);
      path.push(...segment);
      if (fallback) fallbackPath.push(`M ${previous.x} ${previous.y}`, ...segment);
      right = Math.max(right, x);
    }
    let stopReason;
    if (placed.length < count) {
      const { x, direction } = placed.at(-1);
      if (retries > 10000) stopReason = 'The search reached its retry limit.';
      else if (!fits(x + direction * lead) && !options.adjustLead && !options.reverseLead) {
        stopReason = 'The diagonal lead-in extends past the fabric edge.';
      } else if (pitch - lead < gap && !options.adjustLead) {
        stopReason = 'Too little wire remains after the lead-in to reach the next row.';
      }
    }
    return {
      path: path.join(' '), fallbackPath: fallbackPath.join(' '), positions,
      left: 0, right, bottom: placed.at(-1).y, stopReason
    };
  }

  function render() {
    preview.replaceChildren();
    download.disabled = true;
    const input = controls.elements;
    const diagonal = input.turn.value === 'diagonal';
    diagonalLeadControl.hidden = !diagonal;
    input.diagonalLead.disabled = !diagonal;
    if (!controls.checkValidity()) {
      summary.textContent = 'Enter valid dimensions and a whole LED count between 1 and 20,000.';
      return;
    }
    const count = input.count.valueAsNumber;
    const pitch = input.pitch.valueAsNumber;
    const offset = input.offset.valueAsNumber;
    const width = input.width.valueAsNumber;
    const gap = input.gap.valueAsNumber;
    const turn = input.turn.value;
    if (diagonal && offset > width) {
      summary.textContent = 'For diagonal turns, the first LED offset must fit within the first row.';
      return;
    }
    const requestedLength = offset + (count - 1) * pitch;
    const continuation = Object.fromEntries(continuationFields.map(field => [field, input[field].checked]));
    const geometry = Number.isFinite(requestedLength) && (diagonal
      ? diagonalLayout(width, gap, pitch, offset, count, input.diagonalLead.valueAsNumber, continuation)
      : layout(width, gap, requestedLength, turn === 'round'));
    if (!geometry) {
      summary.textContent = 'The wire path is too long to draw. Reduce the LED count, spacing, or first LED offset.';
      return;
    }
    const { path, fallbackPath, pointAt, positions, left, right, bottom, stopReason } = geometry;
    const placed = positions?.length ?? count;
    const length = offset + (placed - 1) * pitch;
    const previewRight = Math.max(right, width);
    const span = Math.max(previewRight - left, bottom, .05);
    const padding = Math.max(span * .06, .05);
    const x = left - padding;
    const y = -padding;
    const w = previewRight - left + 2 * padding;
    const h = bottom + 2 * padding;
    const dot = Math.min(pitch * .18, input.gap.valueAsNumber * .2, span * .011);
    const fontSize = span * .018;
    preview.setAttribute('viewBox', [x, y, w, h].join(' '));
    add(preview, 'rect', { x, y, width: w, height: h, fill: '#0d171f' });

    const gridStep = Math.max(1, 10 ** Math.ceil(Math.log10(Math.max(w, h) / 100)));
    if (input.grid.checked) {
      const grid = add(preview, 'g', { stroke: '#354b58', 'stroke-width': span * .001 });
      for (let i = Math.ceil(x / gridStep); i <= Math.floor((x + w) / gridStep); i++) {
        add(grid, 'line', { x1: i * gridStep, y1: y, x2: i * gridStep, y2: y + h });
      }
      for (let i = Math.ceil(y / gridStep); i <= Math.floor((y + h) / gridStep); i++) {
        add(grid, 'line', { x1: x, y1: i * gridStep, x2: x + w, y2: i * gridStep });
      }
    }
    for (const edge of [0, width]) {
      add(preview, 'line', {
        x1: edge, x2: edge, y1: y, y2: y + h,
        stroke: '#d8ad70', 'stroke-width': 1.5, 'stroke-dasharray': '5 4',
        'vector-effect': 'non-scaling-stroke'
      });
    }
    if (input.wire.checked) {
      const wireStyle = { fill: 'none', 'stroke-width': span * .0025, 'stroke-linejoin': 'round' };
      add(preview, 'path', { ...wireStyle, d: path, stroke: '#78a3b4' });
      if (fallbackPath) add(preview, 'path', { ...wireStyle, d: fallbackPath, stroke: '#ffe066' });
    }
    const leds = add(preview, 'g', { fill: '#9ff3df' });
    const labels = input.labels.checked && add(preview, 'g', {
      fill: '#edf4f6', 'font-size': fontSize, 'font-family': 'system-ui, sans-serif', 'text-anchor': 'middle'
    });
    for (let index = 0; index < placed; index++) {
      const [cx, cy] = positions ? positions[index] : pointAt(offset + index * pitch);
      const stoppedHere = placed < count && index === placed - 1;
      add(leds, 'circle', { cx, cy, r: dot, ...(stoppedHere ? { fill: '#ff6464' } : {}) });
      if (labels) add(labels, 'text', { x: cx, y: cy - dot - fontSize * .25 }).textContent = index + 1;
    }
    summary.textContent = [
      placed === count
        ? `${count.toLocaleString('en-US')} LEDs`
        : `${placed.toLocaleString('en-US')} of ${count.toLocaleString('en-US')} LEDs placed. ${stopReason ?? 'The next row is out of reach with these settings.'}`,
      `${inches.format(length / 12)} ft of wire`,
      `${inches.format(right - left)} × ${inches.format(bottom)} in wire footprint`,
      ...(input.grid.checked ? [`${gridStep} in grid`] : [])
    ].join(' · ');
    download.disabled = false;
  }

  function updatePresetList(selected = '') {
    presetList.replaceChildren(new Option(presets.size ? 'Choose a preset' : 'No saved presets', ''));
    for (const name of presets.keys()) presetList.add(new Option(name, name));
    presetList.value = selected;
  }

  function applyPreset(name) {
    const settings = presets.get(name);
    for (const field of presetFields) {
      const control = controls.elements[field];
      if (control.type === 'checkbox') control.checked = settings[field] ?? false;
      else control.value = field === 'diagonalLead' ? settings[field] ?? '0' : settings[field];
    }
    presetName.value = name;
  }

  presetList.addEventListener('change', () => {
    const name = presetList.value;
    if (!presets.has(name)) return;
    applyPreset(name);
    render();
  });

  document.querySelector('#save-preset').addEventListener('click', () => {
    const name = presetName.value.trim();
    if (!name) {
      presetStatus.textContent = 'Enter a preset name.';
      presetName.focus();
      return;
    }
    if (!controls.reportValidity()) return;
    const settings = Object.fromEntries(presetFields.map(field => {
      const control = controls.elements[field];
      return [field, control.type === 'checkbox' ? control.checked : control.value];
    }));
    const replaced = presets.has(name);
    presets.set(name, settings);
    updatePresetList(name);
    presetStatus.textContent = `${replaced ? 'Updated' : 'Added'} “${name}”. Download the library to keep the change.`;
  });

  function downloadFile(content, type, filename) {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  document.querySelector('#export-presets').addEventListener('click', () => {
    const library = Array.from(presets, ([name, settings]) => ({ name, settings }));
    downloadFile(`window.ledLayoutPresets = ${JSON.stringify(library, null, 2)};\n`, 'text/javascript', 'presets.js');
    presetStatus.textContent = 'Replace presets.js beside index.html with the downloaded file.';
  });

  controls.addEventListener('input', () => {
    presetList.value = '';
    render();
  });
  controls.addEventListener('submit', event => event.preventDefault());
  download.addEventListener('click', () => {
    const svg = preview.cloneNode(true);
    const [, , width, height] = svg.getAttribute('viewBox').split(' ');
    svg.setAttribute('width', width + 'in');
    svg.setAttribute('height', height + 'in');
    downloadFile(new XMLSerializer().serializeToString(svg), 'image/svg+xml', 'led-fabric-layout.svg');
  });
  const firstPreset = presets.keys().next().value;
  updatePresetList(firstPreset);
  if (presets.size) applyPreset(firstPreset);
  render();
</script>

</html>
